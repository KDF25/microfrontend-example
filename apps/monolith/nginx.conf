server {
  listen 80;
  server_name _;
  root /usr/share/nginx/html;
  index index.html;

  # SPA history fallback: all unmatched routes fall through to index.html
  # so react-router can handle them client-side.
  location / {
    try_files $uri $uri/ /index.html;
  }

  # Hashed bundles are safe to cache forever.
  location ~* \.(js|css|svg|png|jpg|jpeg|webp|woff2?)$ {
    expires 1y;
    add_header Cache-Control "public, max-age=31536000, immutable";
  }

  # index.html itself must be revalidated on every request.
  location = /index.html {
    add_header Cache-Control "no-cache";
  }
}
